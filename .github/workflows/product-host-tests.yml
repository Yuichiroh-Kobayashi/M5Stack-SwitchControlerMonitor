name: Product host tests
on:
  push:
    paths:
      - 'src/**'
      - 'tests/product/**'
      - 'tools/core_protocol_reference.py'
      - 'tools/prepare_product_libraries.py'
      - 'tools/product_validation/**'
      - 'tools/product_trial*'
      - '.github/workflows/product-host-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/product/**'
      - 'tools/core_protocol_reference.py'
      - 'tools/prepare_product_libraries.py'
      - 'tools/product_validation/**'
      - 'tools/product_trial*'
      - '.github/workflows/product-host-tests.yml'
permissions:
  contents: read
jobs:
  product-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Execute product C++ and frozen protocol vectors
        run: python3 tests/product/run_host_tests.py
  product-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Exercise offline PowerShell validators
        shell: powershell
        run: ./tests/product/run_trial_preflight_tests.ps1
